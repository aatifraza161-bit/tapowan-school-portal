<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCore — The Operating System for Modern Education</title>
  <meta name="description" content="EduCore is the unified educational SaaS operating system combining zero-secret cloud ERP, native WebRTC VoIP telephony, 50m hardware geofencing, 1:1 Euclidean face biometrics, and 18,000+ CBSE NCERT interactive lessons.">
  <link rel="icon" type="image/png" href="/educore-assets/educore_logo.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-outer: #ffffff;
      --bg-canvas: #ffffff;
      --text-dark: #000000;
      --text-sub: #555555;
      --text-dim: #777777;
      --border-line: #e5e5e5;
      --border-dark: #000000;
      --accent-pill: #000000;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-smoothing: grayscale;
    }

    body {
      background-color: #ffffff;
      color: var(--text-dark);
      font-family: var(--font-sans);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Halftone Dot Matrix Texture Removed */
    .halftone-bg {
      display: none;
    }

    /* Outer Wrapper with Seamless White Canvas */
    .outer-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
    }

    /* The Central White Canvas */
    .main-canvas {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      background: #ffffff;
      color: #000000;
      position: relative;
      box-shadow: none;
      border: none;
    }

    /* Reticle Corner Crop Marks and Edge Ticks Removed */
    .reticle-corner-tl,
    .reticle-corner-tr,
    .reticle-corner-bl,
    .reticle-corner-br,
    .reticle-tick-top,
    .reticle-tick-bottom,
    .reticle-tick-left,
    .reticle-tick-right {
      display: none !important;
    }

    /* Top Navigation inside Canvas */
    .canvas-nav {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 36px;
      border-bottom: 1px solid var(--border-line);
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #000;
    }

    .brand-icon-box {
      width: 32px;
      height: 32px;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-weight: 900;
      font-size: 16px;
    }

    .brand-name {
      font-family: var(--font-sans);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .nav-menu-items {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .nav-menu-link {
      font-size: 13.5px;
      font-weight: 500;
      color: #333;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s ease;
    }

    .nav-menu-link:hover {
      color: #000;
    }

    .nav-auth-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav-ghost {
      font-size: 13.5px;
      font-weight: 600;
      color: #000;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .btn-nav-ghost:hover {
      background: #f4f4f4;
    }

    .btn-nav-black {
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      background: #000;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 6px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav-black:hover {
      background: #222;
      transform: translateY(-1px);
    }

    /* Content Sections inside Canvas */
    .canvas-section {
      padding: 70px 48px;
      border-bottom: 1px solid var(--border-line);
      position: relative;
    }

    @media (max-width: 768px) {
      .canvas-section {
        padding: 40px 20px;
      }
      .canvas-nav {
        padding: 16px 20px;
      }
    }

    /* Technical Category Tag */
    .tech-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 16px;
      display: inline-block;
    }

    /* Hero Typography */
    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }
    }

    .hero-h1 {
      font-size: clamp(34px, 4.4vw, 54px);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -1.8px;
      color: #000000;
      margin-bottom: 24px;
    }

    .bracket-word {
      position: relative;
      display: inline-block;
      font-weight: 900;
    }

    .bracket-word::before {
      content: '[';
      color: #999;
      font-family: var(--font-mono);
      font-weight: 400;
      margin-right: 1px;
    }

    .bracket-word::after {
      content: ']';
      color: #999;
      font-family: var(--font-mono);
      font-weight: 400;
      margin-left: 1px;
    }

    .hero-sub {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-sub);
      margin-bottom: 32px;
    }

    .hero-btn-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-pill-solid {
      background: #000000;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid #000000;
    }

    .btn-pill-solid:hover {
      background: #222;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .btn-pill-outline {
      background: #ffffff;
      color: #000000;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid #000000;
    }

    .btn-pill-outline:hover {
      background: #f7f7f7;
      transform: translateY(-2px);
    }

    /* Video Announcement Stage (Dribbble Video Replica) */
    .video-stage-card {
      position: relative;
      background: #000000;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 30px;
      border: 1px solid #000000;
    }

    .video-stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .video-pill-switch {
      display: inline-flex;
      background: #ffffff;
      border: 1px solid #000000;
      border-radius: 4px;
      overflow: hidden;
      padding: 2px;
    }

    .video-pill-btn {
      background: transparent;
      border: none;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .video-pill-btn.active {
      background: #000000;
      color: #ffffff;
    }

    .video-pill-btn:not(.active) {
      color: #000000;
    }

    .video-screen-container {
      position: relative;
      width: 100%;
      height: 520px;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .video-screen-container {
        height: 280px;
      }
    }

    .video-media-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Inset Reticle Viewfinder on the video container */
    .video-reticle-tl {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 16px;
      height: 16px;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      pointer-events: none;
    }
    .video-reticle-tr {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 16px;
      height: 16px;
      border-top: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      pointer-events: none;
    }
    .video-reticle-bl {
      position: absolute;
      bottom: 16px;
      left: 16px;
      width: 16px;
      height: 16px;
      border-bottom: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      pointer-events: none;
    }
    .video-reticle-br {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 16px;
      height: 16px;
      border-bottom: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      pointer-events: none;
    }

    .video-timecode-tl {
      position: absolute;
      top: 22px;
      left: 38px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
    }
    .video-timecode-tr {
      position: absolute;
      top: 22px;
      right: 38px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
    }

    .play-button-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    .play-button-center:hover {
      transform: translate(-50%, -50%) scale(1.12);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
    }

    .play-button-center span {
      color: #000000;
      font-size: 32px;
      margin-left: 4px;
    }

    /* Section 3: Simple, yet extremely powerful (Principles Carousel) */
    .principles-stage {
      background: #fafafa;
      border: 1px solid var(--border-line);
      border-radius: 8px;
      padding: 48px;
      margin-top: 36px;
      position: relative;
    }

    @media (max-width: 768px) {
      .principles-stage {
        padding: 24px;
      }
    }

    .principles-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 40px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .principles-grid {
        grid-template-columns: 1fr;
      }
    }

    .wireframe-box {
      width: 220px;
      height: 220px;
      background: #ffffff;
      border: 1px solid var(--border-line);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 0 auto;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
    }

    .wireframe-reticle {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: #000;
    }
    .w-tl { top: 8px; left: 8px; border-top: 1.5px solid #000; border-left: 1.5px solid #000; }
    .w-tr { top: 8px; right: 8px; border-top: 1.5px solid #000; border-right: 1.5px solid #000; }
    .w-bl { bottom: 8px; left: 8px; border-bottom: 1.5px solid #000; border-left: 1.5px solid #000; }
    .w-br { bottom: 8px; right: 8px; border-bottom: 1.5px solid #000; border-right: 1.5px solid #000; }

    .stepper-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .stepper-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stepper-counter {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: #000;
    }

    .principle-title {
      font-size: 28px;
      font-weight: 800;
      color: #000;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .principle-desc {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .principle-dots-nav {
      display: flex;
      gap: 8px;
    }

    .p-dot {
      width: 28px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .p-dot.active {
      background: #000000;
      width: 44px;
    }

    /* All Modules Analysis & Screenshot Showcase Section */
    .modules-nav-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 30px;
      scrollbar-width: none;
    }
    .modules-nav-pills::-webkit-scrollbar {
      display: none;
    }

    .mod-pill-btn {
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      background: #f4f4f4;
      border: 1px solid #e0e0e0;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .mod-pill-btn.active {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    .module-detail-card {
      border: 1px solid var(--border-line);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
    }

    .module-detail-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
    }

    @media (max-width: 900px) {
      .module-detail-grid {
        grid-template-columns: 1fr;
      }
    }

    .mod-screenshot-frame {
      background: #000;
      position: relative;
      cursor: zoom-in;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 440px;
    }

    .mod-screenshot-frame img {
      width: 100%;
      height: 100%;
      max-height: 520px;
      object-fit: cover;
      object-position: top;
      display: block;
      transition: transform 0.4s ease;
    }

    .mod-screenshot-frame:hover img {
      transform: scale(1.02);
    }

    .mod-info-content {
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mod-feature-list {
      list-style: none;
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mod-feature-item {
      font-size: 13.5px;
      color: #444;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.5;
    }

    .mod-feature-item span.icon {
      color: #000;
      font-size: 16px;
      margin-top: 2px;
    }

    .mod-tech-badge-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .mod-tech-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      background: #f0f0f0;
      border-radius: 4px;
      color: #333;
      font-weight: 600;
    }

    /* Vision 3-Column Spec Grid (Dribbble 00:23) */
    .vision-spec-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid var(--border-line);
    }

    @media (max-width: 768px) {
      .vision-spec-grid {
        grid-template-columns: 1fr;
      }
    }

    .vision-card {
      text-align: center;
      padding: 24px;
    }

    .vision-num {
      font-family: var(--font-mono);
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    .vision-card-title {
      font-size: 16px;
      font-weight: 700;
      color: #000;
      margin-bottom: 16px;
    }

    .vision-art-box {
      width: 90px;
      height: 90px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Blog / Release Row (Dribbble 00:29) */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 30px;
    }

    @media (max-width: 1024px) {
      .blog-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .blog-grid {
        grid-template-columns: 1fr;
      }
    }

    .blog-card {
      border: 1px solid var(--border-line);
      border-radius: 6px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
      background: #fff;
      transition: all 0.2s ease;
    }

    .blog-card:hover {
      border-color: #000;
      transform: translateY(-2px);
    }

    .blog-card-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: #666;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }

    .blog-card-title {
      font-size: 14px;
      font-weight: 700;
      color: #000;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .blog-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-family: var(--font-mono);
      color: #888;
    }

    .blog-read-link {
      color: #000;
      font-weight: 700;
      text-decoration: none;
    }

    /* CTA Section (Dribbble 00:31) */
    .cta-canvas-section {
      text-align: center;
      padding: 90px 40px;
    }

    .cta-heading {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 900;
      letter-spacing: -1.5px;
      margin-bottom: 24px;
    }

    /* Minimalist Footer (Dribbble 00:32) */
    .canvas-footer {
      padding: 48px 36px 30px 36px;
      border-top: 1px solid var(--border-line);
      font-size: 13px;
      color: #666;
    }

    .footer-columns-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 40px;
      margin-bottom: 40px;
    }

    @media (max-width: 768px) {
      .footer-columns-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .footer-col-head {
      font-size: 12px;
      font-family: var(--font-mono);
      font-weight: 700;
      color: #000;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .footer-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-nav-link {
      color: #666;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .footer-nav-link:hover {
      color: #000;
    }

    .footer-bottom-bar {
      border-top: 1px solid var(--border-line);
      padding-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 12px;
    }

    /* Lightbox Modal */
    .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox-box {
      max-width: 1100px;
      width: 100%;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,0.9);
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .lightbox-head {
      display: flex;
