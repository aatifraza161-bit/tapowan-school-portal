<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Vidya 3D – Robot Avatar</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f4f0ff;--bg2:#ffffff;--ink:#2a1a5e;--mute:#6b5fa0;--pill:#efe9ff;--ring1:#8b5cf6;--ring2:#ec6ad0;--bubble:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a1233;--bg2:#0f0a21;--ink:#f1ecff;--mute:#b4a6e8;--pill:#2a1f52;--bubble:#2a1f52}}
:root[data-theme="dark"]{--bg1:#1a1233;--bg2:#0f0a21;--ink:#f1ecff;--mute:#b4a6e8;--pill:#2a1f52;--bubble:#2a1f52}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'Sora',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow-x:hidden}
.wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
.stage{position:relative;width:min(78vw,340px);aspect-ratio:1;border-radius:50%;padding:5px;background:conic-gradient(from 200deg,var(--ring1),var(--ring2),var(--ring1));box-shadow:0 0 0 10px rgba(139,92,246,.12),0 0 60px 14px rgba(139,92,246,.45);cursor:pointer;transition:width .5s cubic-bezier(.3,.8,.3,1),box-shadow .3s;touch-action:manipulation}
.stage:focus-visible{outline:3px solid var(--ring2);outline-offset:6px}
.stage .inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 38%,#6d4bd1,#2d1a6b 70%,#1b1040)}
canvas{width:100%;height:100%;display:block}
.stage.compact{width:104px}
.bubble{position:absolute;top:-6px;right:-18px;max-width:210px;background:var(--bubble);color:var(--ink);padding:10px 14px;border-radius:16px 16px 16px 4px;font-size:14px;line-height:1.35;box-shadow:0 8px 24px rgba(60,30,140,.25);opacity:0;transform:translateY(6px) scale(.96);transition:.25s;pointer-events:none;z-index:10}
.bubble.show{opacity:1;transform:none}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--pill);color:var(--ink);font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;box-shadow:0 4px 18px rgba(139,92,246,.25)}
.pill i{font-style:normal;color:#f2a93b}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.b{font:inherit;font-weight:500;font-size:14px;color:var(--ink);background:transparent;border:1.5px solid var(--ring1);border-radius:999px;padding:8px 16px;cursor:pointer;transition:all .2s ease}
button.b:hover{background:var(--pill)}
button.b:focus-visible{outline:3px solid var(--ring2);outline-offset:2px}
.hint{color:var(--mute);font-size:13px;margin:0;text-align:center;padding:0 20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage" tabindex="0" role="button" aria-label="Vidya robot avatar. Press to say hello">
    <div class="inner"><canvas id="c"></canvas></div>
    <div class="bubble" id="bubble"></div>
  </div>
  <div class="pill"><i>✦</i> AI Vidya 3D</div>
  <div class="row">
    <button class="b" id="wave">Say hello</button>
    <button class="b" id="size">Compact view</button>
    <a href="index.html" class="b" style="text-decoration:none;display:inline-flex;align-items:center">Go to Portal →</a>
  </div>
  <p class="hint">Move your mouse or finger – Vidya follows you. Tap the robot to chat.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('c'),stage=document.getElementById('stage'),bubble=document.getElementById('bubble');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,.1,100);
let camZ=9,camY=.6,tZ=9,tY=.6;

scene.add(new THREE.HemisphereLight(0xffffff,0x6d4bd1,.9));
const key=new THREE.DirectionalLight(0xffffff,1.1);key.position.set(3,5,6);scene.add(key);
const rim=new THREE.PointLight(0xec6ad0,1.6,20);rim.position.set(-4,2,-2);scene.add(rim);
const fill=new THREE.PointLight(0x5ff3ff,.9,20);fill.position.set(4,-1,3);scene.add(fill);

const white=new THREE.MeshStandardMaterial({color:0xf6f3ff,roughness:.22,metalness:.15});
const dark=new THREE.MeshStandardMaterial({color:0x160d33,roughness:.12,metalness:.7});
const glow=(c)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.4,roughness:.4});
const purple=new THREE.MeshStandardMaterial({color:0x8b5cf6,roughness:.3,metalness:.4,emissive:0x3b1fa0,emissiveIntensity:.5});
const S=(r,sx,sy,sz,m,seg)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,seg||40,seg||40),m);o.scale.set(sx,sy,sz);return o};

const robot=new THREE.Group();scene.add(robot);

// head
const head=new THREE.Group();head.position.y=1.5;robot.add(head);
head.add(S(1,1.15,.95,.95,white,48));
const visor=S(1,.92,.66,.5,dark);visor.position.z=.55;head.add(visor);
const eyes=new THREE.Group();head.add(eyes);
[-.36,.36].forEach(x=>{const e=S(1,.15,.2,.06,glow(0x5ff3ff),24);e.position.set(x,.06,1.0);eyes.add(e)});
const mouth=new THREE.Mesh(new THREE.TorusGeometry(.13,.022,10,28,Math.PI),glow(0xff7ad9));
mouth.rotation.z=Math.PI;mouth.position.set(0,-.12,1.0);head.add(mouth);
[-1,1].forEach(s=>{const ear=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.22,32),purple);ear.rotation.z=Math.PI/2;ear.position.x=s*1.14;head.add(ear);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.26,24),glow(0xb99bff));cap.rotation.z=Math.PI/2;cap.position.x=s*1.14;head.add(cap)});
const ant=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.45,12),white);ant.position.y=1.12;head.add(ant);
const bulb=S(.15,1,1,1,glow(0xff7ad9),24);bulb.position.y=1.42;head.add(bulb);

// body
const body=S(1,.82,1,.7,white,40);body.position.y=-.45;robot.add(body);
const collar=new THREE.Mesh(new THREE.TorusGeometry(.5,.08,16,40),purple);collar.rotation.x=Math.PI/2;collar.position.y=.5;robot.add(collar);
const chest=S(.2,1,1,.5,glow(0x8b5cf6),24);chest.position.set(0,-.2,.68);robot.add(chest);
const chestRing=new THREE.Mesh(new THREE.TorusGeometry(.27,.03,10,32),glow(0x5ff3ff));chestRing.position.set(0,-.2,.66);robot.add(chestRing);

// arms
function arm(side){
  const g=new THREE.Group();g.position.set(side*.98,.1,0);
  const up=new THREE.Mesh(new THREE.CylinderGeometry(.13,.11,.8,20),white);up.position.y=-.4;g.add(up);
  const sh=S(.16,1,1,1,purple,20);g.add(sh);
  const hand=S(.2,1,1,1,white,24);hand.position.y=-.88;g.add(hand);
  robot.add(g);return g;
}
const armR=arm(1),armL=arm(-1);

// shadow
const sh=new THREE.Mesh(new THREE.CircleGeometry(1,40),new THREE.MeshBasicMaterial({color:0x0b0420,transparent:true,opacity:.35}));
sh.rotation.x=-Math.PI/2;sh.position.y=-2.1;sh.scale.set(1.2,1.2,1.2);scene.add(sh);

// state
let waveUntil=0,blinkAt=2,blinkEnd=0,tx=0,ty=0,hx=0,hy=0;
const msgs=["Namaste! I'm Vidya, your study buddy.","Ask me any doubt – maths, science, English!","Let's learn something new today.","Need help with homework? I'm ready!"];
let mi=0,bt;
function say(){
  bubble.textContent=msgs[mi++%msgs.length];bubble.classList.add('show');
  clearTimeout(bt);bt=setTimeout(()=>bubble.classList.remove('show'),3200);
  waveUntil=clock.getElapsedTime()+2.2;
}
addEventListener('pointermove',e=>{
  const r=canvas.getBoundingClientRect();
  tx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/(innerWidth/2)));
  ty=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/(innerHeight/2)));
});
stage.addEventListener('click',say);
stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();say()}});
document.getElementById('wave').onclick=say;
const sizeBtn=document.getElementById('size');
sizeBtn.onclick=()=>{
  const c=stage.classList.toggle('compact');
  sizeBtn.textContent=c?'Full view':'Compact view';
  tZ=c?5.3:9;tY=c?1.5:.6;
};

function resize(){
  const w=canvas.clientWidth||300,h=canvas.clientHeight||300;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);resize();

const clock=new THREE.Clock();
setTimeout(()=>{say()},700);
function tick(){
  requestAnimationFrame(tick);
  const t=clock.getElapsedTime(),k=reduce?0:1;
  robot.position.y=Math.sin(t*1.6)*.12*k;
  robot.rotation.y=Math.sin(t*.7)*.12*k;
  sh.scale.setScalar(1.2-Math.sin(t*1.6)*.08*k);
  // head follow
  hx+=(tx*.7-hx)*.08;hy+=(ty*.4-hy)*.08;
  head.rotation.y=hx;head.rotation.x=hy;head.rotation.z=-hx*.08;
  // blink
  if(t>blinkAt){blinkEnd=t+.13;blinkAt=t+2+Math.random()*3}
  const closed=t<blinkEnd;
  eyes.scale.y+=((closed?.08:1)-eyes.scale.y)*.5;
  // antenna & chest pulse
  const p=.5+.5*Math.sin(t*3);
  bulb.scale.setScalar(.9+p*.35);bulb.material.emissiveIntensity=.8+p*1.2;
  chest.material.emissiveIntensity=.8+p*1.4;
  chestRing.rotation.z=t*1.2;
  // arms
  const waving=t<waveUntil;
  const rT=waving?2.55+Math.sin(t*10)*.3:.22+Math.sin(t*1.6)*.04;
  armR.rotation.z+=(rT-armR.rotation.z)*.15;
  armL.rotation.z+=(-(.22+Math.sin(t*1.6+1)*.04)-armL.rotation.z)*.15;
  mouth.scale.set(waving?1.3:1,waving?1.3:1,1);
  // camera
  camZ+=(tZ-camZ)*.08;camY+=(tY-camY)*.08;
  camera.position.set(0,camY,camZ);camera.lookAt(0,camY,0);
  renderer.render(scene,camera);
}
tick();
})();
</script>
</body>
</html>
